<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-label="Naomi Gym">

  <defs>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14b866"/>
      <stop offset="100%" stop-color="#0d7043"/>
    </linearGradient>
    <linearGradient id="heroPaper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eaf5ee"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" rx="0" fill="url(#hero)"/>
  <circle cx="120" cy="110" r="170" fill="rgba(255,255,255,0.10)"/>
  <circle cx="710" cy="530" r="200" fill="rgba(10,36,25,0.18)"/>
  <circle cx="680" cy="120" r="46" fill="#c8f24a"/>
  <!-- big dumbbell motif -->
  <g transform="translate(250 90) scale(12.5)" fill="none" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"><path d="M8 12h8 M8 8.5v7 M16 8.5v7 M5.5 10v4 M18.5 10v4" /></g>
  <!-- floating stat card -->
  <g transform="translate(110 360)">
    <rect width="320" height="150" rx="26" fill="url(#heroPaper)"/>
    <rect x="28" y="30" width="150" height="18" rx="9" fill="#0d7043" opacity="0.9"/>
    <rect x="28" y="64" width="240" height="12" rx="6" fill="#0a2419" opacity="0.12"/>
    <rect x="28" y="86" width="200" height="12" rx="6" fill="#0a2419" opacity="0.12"/>
    <rect x="28" y="108" width="120" height="14" rx="7" fill="#14b866"/>
    <circle cx="262" cy="44" r="22" fill="#c8f24a"/>
  </g>
  <!-- activity bars -->
  <g transform="translate(470 300)" fill="#ffffff" opacity="0.92">
    <rect x="0" y="120" width="34" height="80" rx="10"/>
    <rect x="48" y="80" width="34" height="120" rx="10"/>
    <rect x="96" y="40" width="34" height="160" rx="10"/>
    <rect x="144" y="100" width="34" height="100" rx="10"/>
  </g>
</svg>
